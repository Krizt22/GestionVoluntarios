<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campañas - FDC</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="contenedor">
    <h1>Campañas</h1>

    <div class="panel">
      <h2>Crear campaña</h2>
      <form id="campanaForm">
        <label for="name">Nombre</label>
        <input type="text" id="name" required>

        <label for="objective">Objetivo</label>
        <input type="text" id="objective">

        <label for="description">Descripción</label>
        <input type="text" id="description">

        <label for="start_date">Fecha inicio</label>
        <input type="date" id="start_date" required>

        <label for="end_date">Fecha fin</label>
        <input type="date" id="end_date" required>

        <button type="submit">Crear campaña</button>
      </form>
      <p id="mensaje" class="mensaje"></p>
    </div>

    <h2>Listado de campañas</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Nombre</th><th>Inicio</th><th>Fin</th><th>Estado</th><th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaCampanas"></tbody>
    </table>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth-helper.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/campanas.js"></script>
</body>
</html>
