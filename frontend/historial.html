<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Historial de Participación - FDC</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="contenedor">
    <h1>Mi Historial de Participación</h1>

    <div class="panel">
      <label>Campaña (ID):</label>
      <input type="number" id="filtro-campana" placeholder="Opcional">

      <label>Desde:</label>
      <input type="date" id="filtro-desde">

      <label>Hasta:</label>
      <input type="date" id="filtro-hasta">

      <button id="btn-filtrar">Filtrar</button>

      <p class="mensaje"><strong>Total de horas acumuladas:</strong> <span id="total-horas">-</span></p>
    </div>

    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Campaña</th>
          <th>Actividad</th>
          <th>Estado inscripción</th>
          <th>Asistencia</th>
          <th>Horas</th>
        </tr>
      </thead>
      <tbody id="tabla-historial"></tbody>
    </table>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth-helper.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/historiall.js"></script>
</body>
</html>
