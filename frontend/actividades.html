<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actividades - FDC</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="contenedor">
    <h1>Actividades</h1>

    <div class="panel">
      <h2>Crear actividad</h2>
      <form id="actividadForm">
        <label for="campaign_id">ID de campaña</label>
        <input type="number" id="campaign_id" required>

        <label for="name">Nombre</label>
        <input type="text" id="name" required>

        <label for="location">Ubicación</label>
        <input type="text" id="location">

        <label for="date">Fecha</label>
        <input type="date" id="date" required>

        <label for="max_slots">Cupo máximo</label>
        <input type="number" id="max_slots" min="1" required>

        <button type="submit">Crear actividad</button>
      </form>
      <p id="mensaje" class="mensaje"></p>
    </div>

    <h2>Actividades existentes</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Nombre</th><th>Campaña</th><th>Fecha</th><th>Ubicación</th><th>Cupo disponible</th>
        </tr>
      </thead>
      <tbody id="tablaActividades"></tbody>
    </table>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth-helper.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/actividades.js"></script>
</body>
</html>
