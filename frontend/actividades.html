<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actividades - FDC</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .tabla-container { max-width: 800px; margin: 30px auto; background: white; padding: 20px; border: 1px solid #ccc; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
  </style>
</head>
<body>

  <!-- Sub-tarea 7.4: formulario crear actividad -->
  <div class="login-container">
    <h1>Crear actividad</h1>
    <form id="actividadForm">
      <label for="campaign_id">ID de campaña</label>
      <input type="number" id="campaign_id" required>

      <label for="name">Nombre</label>
      <input type="text" id="name" required>

      <label for="location">Ubicación</label>
      <input type="text" id="location">

      <label for="date">Fecha</label>
      <input type="date" id="date" required>

      <label for="max_slots">Cupo máximo</label>
      <input type="number" id="max_slots" min="1" required>

      <button type="submit">Crear actividad</button>
    </form>
    <p id="mensaje" class="mensaje"></p>
  </div>

  <!-- Sub-tarea 7.5: listado de actividades disponibles -->
  <div class="tabla-container">
    <h1>Actividades disponibles</h1>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Nombre</th><th>Campaña</th><th>Fecha</th><th>Ubicación</th><th>Cupo disponible</th>
        </tr>
      </thead>
      <tbody id="tablaActividades"></tbody>
    </table>
  </div>

  <script src="js/auth-helper.js"></script>
  <script src="js/actividades.js"></script>
</body>
</html>
