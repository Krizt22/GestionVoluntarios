<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asignar supervisor - FDC</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="login-container">
    <h1>Asignar supervisor</h1>

    <form id="asignarForm">
      <label for="activity_id">ID de actividad</label>
      <input type="number" id="activity_id" required>

      <label for="supervisor_id">Supervisor</label>
      <select id="supervisor_id" required></select>

      <button type="submit">Asignar</button>
    </form>

    <p id="mensaje" class="mensaje"></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth-helper.js"></script>
  <script src="js/asignar-supervisor.js"></script>
</body>
</html>
